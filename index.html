<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trivia Battle Royale</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <div id="screen-start" class="screen">
            <h1 class="logo">TRIVIA<span>Battle</span></h1>
            <input type="text" id="player-name" placeholder="Numele tău..." maxlength="12">
            <div class="actions">
                <button onclick="pregatesteCreare()" class="btn-main">Creează Cameră</button>
                <div class="divider">sau</div>
                <input type="text" id="roomCode" placeholder="Cod cameră">
                <button onclick="pregatesteJoin()" class="btn-sub">Intră în Joc</button>
            </div>
        </div>

        <div id="screen-lobby" class="screen" style="display:none;">
            <h2>Cameră: <span id="display-room-code">----</span></h2>
            <p id="waiting-msg">Așteptăm adversarul...</p>
            <div id="category-selector" style="display:none;">
                <h3>Alege 4 Categorii:</h3>
                <div id="cat-grid"></div>
                <button id="start-game-btn" disabled onclick="startMeci()" class="btn-main">ÎNCEPE MECIUL</button>
            </div>
        </div>

        <div id="screen-game" class="screen" style="display:none;">
            <div class="scoreboard">
                <div class="player p1-box"><span id="name-p1">P1</span>: <span id="score-p1">0</span></div>
                <div class="timer" id="timer">15</div>
                <div class="player p2-box"><span id="name-p2">P2</span>: <span id="score-p2">0</span></div>
            </div>
            <div class="game-card">
                <div id="category-badge">ISTORIE</div>
                <h2 id="question-text">Întrebarea apare aici?</h2>
                <div id="answers-grid"></div>
            </div>
        </div>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
